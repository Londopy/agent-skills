name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: in sync with upstream, lints clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: skills/ match their upstream repos
        run: python sync.py --check
      - name: Every skill registers and lints (strict)
        run: python skills/skill-rollcall/scripts/rollcall.py --claude-home ./.no-home --no-plugins --project . --skills-dir skills --lint --strict --full
      - name: Content audit (strict: no high findings)
        run: python skills/skill-rollcall/scripts/rollcall.py --claude-home ./.no-home --no-plugins --project . --skills-dir skills --audit --strict --problems-only
