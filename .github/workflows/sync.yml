name: Sync from upstream

on:
  schedule:
    - cron: "17 6 * * 1"     # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pull each upstream and copy its skill
        run: python sync.py
      - name: Commit as the repo owner if anything changed
        run: |
          if git diff --quiet && git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "Londopy"
          git config user.email "Londopy@users.noreply.github.com"
          git add -A
          git commit -m "Sync skills from upstream ($(date -u +%Y-%m-%d))"
          git push
